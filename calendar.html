<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="calendar.css" />
  <title>Document</title>
</head>

<body>
  <img class="sprial-edge" src="/img/spiral-notebook-svgrepo-com.svg" />
  <div class="calendar">
    <header class="header_container">
      <button id="back" class="progress-btn">←</button>
      <h2 class="month"></h2>
      <button id="forward" class="progress-btn">→</button>
    </header>
    <div class="daysOfWeek">
      <div>Sunday</div>
      <div>Monday</div>
      <div>Tuesday</div>
      <div>Wednesday</div>
      <div>Thursday</div>
      <div>Friday</div>
      <div>Saturday</div>
    </div>
    <main class="days">
      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn">7</button>
    </main>
  </div>
  <script src="calendar.js"></script>
</body>

</html>
